---
# =============================================================================
# roles/uxa_relativity_v2/tasks/relativity_agent.yml
# Converted from recipes/relativity_agent.rb (Functions AGT / CNV / DTS).
# =============================================================================

# ----- Disk init (only in Test Kitchen / policy_group == local) -----
- name: Initialise pagefile disk (local/kitchen only)
  ansible.builtin.include_tasks: _disk_init.yml
  loop:
    - { letter: "{{ pagefile.driveletter }}", label: "{{ pagefile.drivelabel }}" }
  loop_control:
    loop_var: disk
  when: policy_group == 'local'

# ----- Additional pagefile on the dedicated disk -----
- name: Check pagefile drive is present
  ansible.windows.win_stat:
    path: "{{ pagefile.driveletter }}:\\"
  register: pagefile_drive

- name: Set additional pagefile
  community.windows.win_pagefile:
    drive: "{{ pagefile.driveletter }}"
    initial_size: "{{ pagefile_add }}"
    maximum_size: "{{ pagefile_add }}"
    override: true
    state: present
  when: pagefile_drive.stat.exists

# ----- Install Windows Features -----
- name: Install agent Windows features
  ansible.windows.win_feature:
    name: "{{ agent.features }}"
    state: present

# ----- Agent firewall rules -----
- name: Allow agent inbound TCP ports
  community.windows.win_firewall_rule:
    name: "{{ item }}-Inbound"
    localport: "{{ item }}"
    protocol: tcp
    direction: in
    action: allow
    enabled: true
    state: present
  loop:
    - '135'
    - '8095'
    - '8990'
    - '8995'
    - '10001-10030'
    - '49152-65535'

# ----- Per-function extra ports -----
- name: Allow port 22 inbound (AGT only)
  community.windows.win_firewall_rule:
    name: '22-Inbound'
    localport: '22'
    protocol: tcp
    direction: in
    action: allow
    enabled: true
    state: present
  when: scalr.variables.Function == 'AGT'

- name: Allow port 6870 inbound (DTS only)
  community.windows.win_firewall_rule:
    name: '6870-Inbound'
    localport: '6870'
    protocol: tcp
    direction: in
    action: allow
    enabled: true
    state: present
  when: scalr.variables.Function == 'DTS'

