# =============================================================================
# inventory/hosts.ini
#
# One group per Relativity Function is the natural mapping of the kitchen.yml
# suites. Set the Function (and any per-role overrides) in group_vars, or inline
# here. All hosts must be reachable over WinRM (see the [relativity:vars] block).
# =============================================================================

[rel_agt]
# agt01.example.com

[rel_cnv]
# cnv01.example.com

[rel_dts]
# dts01.example.com

[rel_ana]
# ana01.example.com

[rel_app]
# app01.example.com

[rel_sst]
# sst01.example.com

[rel_sql]
# sql01.example.com

[rel_web]
# web01.example.com

[rel_rdc]
# rdc01.example.com

[rel_msb]
# msb01.example.com

[rel_dg]
# dg01.example.com

# Parent group -- site.yml targets `relativity`
[relativity:children]
rel_agt
rel_cnv
rel_dts
rel_ana
rel_app
rel_sst
rel_sql
rel_web
rel_rdc
rel_msb
rel_dg

# WinRM connection settings (equivalent to kitchen.yml `transport: winrm`)
[relativity:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_port=5986
ansible_winrm_server_cert_validation=ignore
# ansible_user and ansible_password should come from an encrypted vault file.

# --- Per-group Function assignments ---
# Each group overrides scalr.variables.Function (and any function-specific
# variables) in its own group_vars file: group_vars/<groupname>.yml
# See group_vars/rel_sql.yml and group_vars/rel_msb.yml for worked examples.
# The base defaults for every scalr variable live in group_vars/all.yml.
