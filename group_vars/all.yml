---
# =============================================================================
# group_vars/all.yml
#
# These are the per-deployment "scalr variables". In the Chef cookbook they
# arrived as node['scalr']['variables'][...] (populated by Scalr / kitchen.yml
# test suites). In Ansible they belong in inventory (group_vars / host_vars).
#
# The example values below are taken from the kitchen.yml test suites. Override
# per host or per group of hosts (one group per Function is the natural mapping).
#
# `Function` selects which set of role tasks run (see roles/.../tasks/main.yml):
#   AGT  -> base + agent + harden          (Agent server)
#   CNV  -> base + agent + harden          (Conversion agent server)
#   DTS  -> base + agent + harden          (DTSearch agent server)
#   ANA  -> base + analytics + harden      (Analytics server)
#   APP  -> base + worker + harden         (Worker server)
#   WRK  -> base + worker + harden         (Worker server)
#   SST  -> base + secretstore + harden    (Secret Store server)
#   SQL  -> base + sql + harden            (SQL server)
#   WEB  -> base + web + harden            (Web server)
#   RDC  -> base + web + harden            (RDC server)
#   MSB  -> base + servicebus + harden     (Message Broker / RabbitMQ server)
#   ELM  -> base + datagrid + harden       (DataGrid master)
#   ELD  -> base + datagrid + harden       (DataGrid data)
#   ELC  -> base + datagrid + harden       (DataGrid client)
# =============================================================================

# In Chef this was node['policy_group']; 'local' == Test Kitchen. Set to 'local'
# to enable the disk-initialisation blocks and test-only behaviour, or 'prod'
# for real deployments.
policy_group: 'prod'

scalr:
  variables:
    # --- Common to every Function ---
    Geocode: 'AUSSC'
    Application: 'REL'
    AppInstance: 2
    Domain: 'test-agt'
