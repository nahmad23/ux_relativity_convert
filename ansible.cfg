[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
# scalr.variables is a nested dict overridden per-group; merge so a group_vars
# file only needs to restate the keys it changes (see group_vars/rel_sql.yml).
hash_behaviour = merge
stdout_callback = yaml
force_color = True

[inventory]
enable_plugins = ini, yaml

